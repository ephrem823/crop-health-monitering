services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    environment:
      - MODEL_PATH=/app/models/crop_health_model_fixed.h5
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://backend:8000
    ports:
      - "80:80"
    depends_on:
      - backend
